name: test-allusers

# Temporary: exercises the all-users install on a real Windows machine (the
# runner is an administrator, so there is no UAC prompt). Not merged to main.
on:
  push:
    branches: [allusers-topmost]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages -ExcludeVersion | Out-Null
          cmake -S . -B build -A x64 -DWEBVIEW2_DIR="$PWD/packages/Microsoft.Web.WebView2" | Out-Null
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { throw "build failed" }

      - name: Where this runs
        shell: pwsh
        run: |
          "user: $(whoami)   step session: $((Get-Process -Id $PID).SessionId)"
          qwinsta
          query user 2>&1
          exit 0

      - name: Turn on, launch, relaunch, turn off
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = (Resolve-Path build/Release/OverlayManager.exe).Path
          $pf   = Join-Path $env:ProgramFiles 'TSOOL GEE\Overlay Manager\OverlayManager.exe'
          $data = Join-Path $env:ProgramData 'TSOOL GEE\Overlay Manager'
          $fail = @()
          function Check($ok, $what) { if ($ok) { "PASS  $what" } else { "FAIL  $what"; $script:fail += $what } }

          # A personal configuration with one picture outside ProgramData.
          $src = Join-Path $env:RUNNER_TEMP 'src-cfg'; New-Item -ItemType Directory -Force $src | Out-Null
          $img = Join-Path $env:RUNNER_TEMP 'pic.png'; Copy-Item res/icon-preview.png $img
          @("[General]","Count=1","AutoUpdate=0","[Overlay_0]","Name=test","Image=$img","Enabled=1",
            "Width=200","Height=200","AnchorH=2","AnchorV=2","OffsetX=2","OffsetY=2","Opacity=255") |
            Set-Content (Join-Path $src 'config.ini') -Encoding Unicode
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value

          $p = Start-Process $exe -ArgumentList "/allusers-enable `"$sid`" `"$src`"" -Wait -PassThru
          Check ($p.ExitCode -eq 0) "enable exit code 0 (got $($p.ExitCode))"
          Check (Test-Path $pf) "copied to Program Files"
          Check (Test-Path "$data\allusers.ini") "marker written"
          $cfg = Get-Content "$data\config.ini" -Raw
          Check ($cfg -match [regex]::Escape("$data\images\pic.png")) "picture path moved to ProgramData\images"
          Check (Test-Path "$data\images\pic.png") "picture copied"
          $acl = (Get-Acl $data).Access | ForEach-Object { "$($_.IdentityReference)=$($_.FileSystemRights)" }
          $acl
          Check ([bool]($acl -match 'BUILTIN\\Users=ReadAndExecute')) "users may only read"
          $svc = Get-Service OverlayManagerAllUsers -ErrorAction SilentlyContinue
          Check ($svc -and $svc.Status -eq 'Running') "service running"
          Check ((Get-CimInstance Win32_Service -Filter "Name='OverlayManagerAllUsers'").PathName -like "*Program Files*") "service runs the Program Files copy"
          Check (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Overlay Manager.lnk") "Start menu shortcut"

          # Started in the logged-on session?
          $active = (qwinsta | Select-String 'Active') -ne $null
          "active console session: $active"
          Start-Sleep 15
          $inSession = { Get-Process OverlayManager -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $pf -and $_.SessionId -ne 0 } }
          Get-Process OverlayManager -ErrorAction SilentlyContinue | Format-Table Id, SessionId, Path -AutoSize | Out-String
          if ($active) {
            $procs = @(& $inSession)
            Check ($procs.Count -ge 1) "service started it in the user's session"
            $procs | Stop-Process -Force          # only the session's copy, not the service
            Start-Sleep 15
            Check (@(& $inSession).Count -ge 1) "service started it again after it was killed"

            Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text; using System.Collections.Generic;
          public class W {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L,T,Rt,B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static List<KeyValuePair<string,IntPtr>> Of(uint pid) { var r = new List<KeyValuePair<string,IntPtr>>(); EnumWindows((h,l)=>{ uint p; GetWindowThreadProcessId(h, out p); if (p==pid){ var c=new StringBuilder(64); GetClassName(h,c,64); r.Add(new KeyValuePair<string,IntPtr>(c.ToString(),h)); } return true; }, IntPtr.Zero); return r; }
            public static IntPtr Find(uint pid, string cls) { foreach (var kv in Of(pid)) if (kv.Key==cls) return kv.Value; return IntPtr.Zero; }
          }
          "@
            # The manager closes it on purpose (tray "Exit"): the service leaves the session alone.
            $owner = @(& $inSession)[0]
            [void][W]::PostMessage([W]::Find([uint32]$owner.Id, 'OverlayMgrAppWnd'), 0x0111, [IntPtr]102, [IntPtr]::Zero)
            Start-Sleep 3
            Check ($owner.HasExited -or -not (Get-Process -Id $owner.Id -ErrorAction SilentlyContinue)) "manager's Exit closes it"
            Check (Test-Path "$data\session-$($owner.SessionId).exited") "exit leaves a note for the service"
            Start-Sleep 15
            Check (@(& $inSession).Count -eq 0) "service does not restart it after the manager's Exit"

            # Another user: a standard account, same session (via runas).
            $pw = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 16 | ForEach-Object { [char]$_ }) + 'aA1!'
            net user omviewer $pw /add | Out-Null
            $cred = New-Object PSCredential('omviewer', (ConvertTo-SecureString $pw -AsPlainText -Force))
            $v = Start-Process $pf -ArgumentList '/minimized' -Credential $cred -LoadUserProfile -WorkingDirectory (Split-Path $pf) -PassThru
            Start-Sleep 8
            Check (-not $v.HasExited) "another user's copy runs"
            $wins = [W]::Of([uint32]$v.Id)
            ($wins | ForEach-Object { $_.Key }) -join ', '
            $ov = [W]::Find([uint32]$v.Id, 'OverlayMgrOverlayWnd')
            Check ($ov -ne [IntPtr]::Zero -and [W]::IsWindowVisible($ov)) "another user sees the layer"
            Check ([W]::Find([uint32]$v.Id, 'OverlayMgrManagerWnd') -eq [IntPtr]::Zero) "another user gets no settings window"
            $r1 = New-Object W+R; [void][W]::GetWindowRect($ov, [ref]$r1)

            # The manager moves the layer: it moves on the other user's screen too.
            $ini = "$data\config.ini"
            (Get-Content $ini -Raw -Encoding Unicode) -replace 'OffsetX=[0-9.]+', 'OffsetX=30.00' | Set-Content $ini -Encoding Unicode -NoNewline
            Start-Sleep 6
            $ov2 = [W]::Find([uint32]$v.Id, 'OverlayMgrOverlayWnd')
            $r2 = New-Object W+R; [void][W]::GetWindowRect($ov2, [ref]$r2)
            "layer x before: $($r1.L)  after: $($r2.L)"
            Check ($r2.L -ne $r1.L) "the manager's change shows up for the other user"

            # The other user cannot close it from outside either.
            [void][W]::PostMessage([W]::Find([uint32]$v.Id, 'OverlayMgrAppWnd'), 0x0111, [IntPtr]102, [IntPtr]::Zero)
            Start-Sleep 3
            Check (-not $v.HasExited) "another user's copy ignores Exit"
            $v | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
          } else {
            "no active session on this runner: launch-into-session not tested here"
          }

          # A personal copy started at logon hands over (exits) instead of competing.
          $pp = Start-Process $exe -ArgumentList '/minimized' -PassThru; Start-Sleep 5
          Check ($pp.HasExited) "personal copy leaves when installed for all users"

          $p = Start-Process $exe -ArgumentList '/allusers-disable' -Wait -PassThru
          Check ($p.ExitCode -eq 0) "disable exit code 0 (got $($p.ExitCode))"
          Check (-not (Get-Service OverlayManagerAllUsers -ErrorAction SilentlyContinue)) "service removed"
          Check (-not (Test-Path "$data\allusers.ini")) "marker removed"
          Start-Sleep 8
          $left = Get-Process OverlayManager -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $pf }
          Check ($left.Count -eq 0) "running copies closed after turning off"

          if ($fail.Count) { throw "$($fail.Count) check(s) failed" }
